name: Bug report
description: The plugin did something it shouldn't have, or didn't do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📸 Screenshots help a lot
        A picture of the sidebar, the overlay or the bank often shows the problem straight away. Paste or drag it into "What happened?" below.

        - **Windows:** press **Win + Shift + S** to open the Snipping Tool, then drag a box round what you want.
        - **Mac:** press **Cmd + Ctrl + Shift + 4**, then drag a box. It's copied, ready to paste here.

        To keep yourself anonymous if you'd like: collapse the chat box first (click the chat tab that's open), and leave your name out of the box, or crop it off. RuneLite shows it in the top-left corner of the window.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What the plugin showed or did. Paste or drag screenshots in here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: Where you were, which tab and settings, and what you did just before.
      placeholder: |
        1. Started a herb run from the Farming Guild
        2. ...
  - type: input
    id: version
    attributes:
      label: RuneLite version
      description: Shown in RuneLite's Info panel.
  - type: textarea
    id: log
    attributes:
      label: Client log (optional)
      description: Lines from ~/.runelite/logs/client.log around when it happened. Check there's nothing personal in it first.
      render: text
